{% extends 'base.html' %}
{% block title %}Accueil{% endblock %}

{% block content %}
<section id="todo-list">
  <div class="content">
    <h1>To-Do List</h1>
    <form action="/add" method="POST" aria-label="Ajouter une tâche">
      <label for="title">Nom de la tâche</label>
      <input type="text" id="title" name="title" required>
      <button type="submit">Ajouter</button>
    </form>
    {% if tasks %}
      <h2 class="sr-only" id="id-group-label">Eléments de la To-Do List</h2>
      <div class="group" role="group" aria-labelledby="id-group-label">
        <ul>  
          {% for task in tasks %}
            <li>
              <div role="checkbox" id="task-{{ task.id }}" name="task-{{ task.id }}"
              aria-checked="{% if task.done %}true{% else %}false{% endif %}"
              onclick="location.href='/toggle/{{ task.id }}'"
              aria-label="Marquer {{ task.title }} comme {% if task.done %}non terminée{% else %}terminée{% endif %}">
                <span {% if task.done %}aria-label="Tâche terminée"{% endif %}>{{ task.title }}</span>
              </div>
              <a href="/delete/{{ task.id }}" role="button" aria-label="Supprimer {{ task.title }}">❌</a>
            </li>
          {% endfor %}
        </ul>
      </div>
    {% endif %}
  </div>
</section>
{% endblock %}
